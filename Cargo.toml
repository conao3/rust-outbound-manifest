[package]
name = "outbound-manifest"
version = "0.1.0"
edition = "2021"
description = "Seal and verify external-message recipients, bodies, and attachments"
license = "MIT"
repository = "https://github.com/conao3/rust-outbound-manifest"

[[bin]]
name = "outbound-manifest"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
